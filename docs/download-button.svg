<svg xmlns="http://www.w3.org/2000/svg" width="304" height="74" viewBox="0 0 304 74" role="img" aria-label="Downloads — Windows and Android, v0.1.1">
  <title>Downloads — Windows and Android · v0.1.1</title>
  <defs>
    <linearGradient id="plate" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#131d33"/>
      <stop offset="1" stop-color="#0a1120"/>
    </linearGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#1d8cf8" stop-opacity="0.9"/>
      <stop offset="0.55" stop-color="#2354d6" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#1d8cf8" stop-opacity="0.2"/>
    </linearGradient>
    <linearGradient id="crest" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#5bc4f8" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#5bc4f8" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#5bc4f8" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- Plaque : angles doux plutôt qu'une pilule, comme les panneaux de l'app -->
  <rect x="1" y="1" width="302" height="72" rx="14" fill="url(#plate)"/>
  <rect x="1.5" y="1.5" width="301" height="71" rx="13.5" fill="none" stroke="url(#edge)" stroke-width="1.4"/>
  <rect x="52" y="1.5" width="200" height="1.6" fill="url(#crest)"/>

  <!-- Colonne d'icône, détachée par un filet vertical -->
  <g transform="translate(30,25)" stroke="#5bc4f8" stroke-width="2.2" fill="none"
     stroke-linecap="round" stroke-linejoin="round">
    <path d="M11 0 v14"/>
    <path d="M4.5 8.5 l6.5 6.5 6.5-6.5"/>
    <path d="M0 22 h22"/>
  </g>
  <rect x="76" y="17" width="1" height="40" fill="#1d8cf8" fill-opacity="0.26"/>

  <text x="96" y="34" fill="#eaf1fd" font-size="18" font-weight="600" letter-spacing="0.2"
        font-family="'Segoe UI',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif">Downloads</text>
  <text x="96" y="53" fill="#8fa8cc" font-size="12" font-weight="500" letter-spacing="0.55"
        font-family="ui-monospace,'SF Mono','Cascadia Mono',Consolas,monospace">WINDOWS · ANDROID</text>

  <!-- Pastille de version, alignée à droite -->
  <rect x="228" y="26" width="54" height="22" rx="11" fill="#1d8cf8" fill-opacity="0.14"
        stroke="#1d8cf8" stroke-opacity="0.45"/>
  <text x="255" y="41" fill="#7cc0fb" font-size="11.5" font-weight="600" text-anchor="middle" letter-spacing="0.3"
        font-family="ui-monospace,'SF Mono','Cascadia Mono',Consolas,monospace">v0.1.1</text>
</svg>
